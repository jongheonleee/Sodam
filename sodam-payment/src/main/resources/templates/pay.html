<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
  <head>
    <meta charset="utf-8" />
    <script src="https://js.tosspayments.com/v1/payment-widget"></script>
  </head>
  <body>

  <div>
    <p>주문정보</p>
    <p>주문번호: <span th:text="${order.orderId}"></span></p>
    <p>주문내용: <span th:text="${order.description}"></span></p>
    <p>총 주문 금액: <span th:text="${order.orderTotAmount}"></span></p>
    <p>총 할인 금액: <span th:text="${order.discTotAmount}"></span></p>
    <p>최종 결제 금액: <span th:text="${order.paidTotAmount}"></span></p>
  </div>

    <!-- 할인 쿠폰 -->
    <div>
      <input type="checkbox" id="coupon-box" />
      <label for="coupon-box"> 5,000원 쿠폰 적용 </label>
    </div>

    <!-- 결제 UI, 이용약관 UI 영역 -->
    <div id="payment-method"></div>
    <div id="agreement"></div>

    <!-- 결제하기 버튼 -->
    <button id="payment-button">결제하기</button>

    <script>
      const coupon = document.getElementById("coupon-box");
      const button = document.getElementById("payment-button");
      const amount = `[[${order.paidTotAmount}]]`;

      // 구매자의 고유 아이디를 불러와서 customerKey로 설정하세요.
      // 이메일・전화번호와 같이 유추가 가능한 값은 안전하지 않습니다.
      // 이 부분 현재 잘안됨 -> 이거 때문에 위젯 렌딩 과정에서 문제 발생함
      // const widgetClientKey = `[[${@environment.getProperty('payment.toss.key.client')}]]`; -- 이 부분 키 다시 발급 받고 적용해야함
      const widgetClientKey = `[[${@environment.getProperty('payment.toss.key.client')}]]`;
      const customerKey = `[[${order.userId}]]`;
      const paymentWidget = PaymentWidget(widgetClientKey, customerKey); // 회원 결제
      // const paymentWidget = PaymentWidget(widgetClientKey, PaymentWidget.ANONYMOUS) // 비회원 결제

      const paymentMethodWidget = paymentWidget.renderPaymentMethods(
              "#payment-method",
              // { value: `[[${order.orderTotAmount}]]` },
              { value: `[[${order.paidTotAmount}]]` },
              { variantKey: "DEFAULT" }
      );

      paymentWidget.renderAgreement(
              "#agreement",
              { variantKey: "AGREEMENT" }
      );

      coupon.addEventListener("change", function () {
        if (coupon.checked) {
          paymentMethodWidget.updateAmount(amount - 5000);
        } else {
          paymentMethodWidget.updateAmount(amount);
        }
      });

      button.addEventListener("click", function () {
        // 결제를 요청하기 전에 orderId, amount를 서버에 저장하세요.
        // 결제 과정에서 악의적으로 결제 금액이 바뀌는 것을 확인하는 용도입니다.
        paymentWidget.requestPayment({
          orderId: `[[${order.pgOrderId}]]`,
          orderName: `[[${order.description}]]`,
          successUrl: "http://localhost:8080/pay/success",
          failUrl: "http://localhost:8080/pay/fail",
          customerEmail: "customer123@gmail.com",
          customerName: `[[${order.userId}]]`,
          customerMobilePhone: "01012341234",
        });
      });
    </script>
  </body>
</html>
