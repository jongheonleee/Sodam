 spring:
  config:
    import: optional:file:.env[.properties] # .env 활용
  output:
    ansi:
      enabled: always
  application:
    name: sodam-payment
  r2dbc:
    url: r2dbc:mysql://localhost:3306/sodam?ssl=false&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: localhost
      port: 6379
  datasource: # flyway 를 위해서 JDBC로 연결설정, R2DBC에서는 flyway 연결못함
    url: jdbc:mysql://localhost:3306/sodam?useSSL=false&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway: # flyway 로 RDB 형상관리
    locations: classpath:flyway
    baseline-on-migrate: true
    baseline-version: 1
    enabled: true
  thymeleaf:
    enabled: true
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    cache: false
    encoding: UTF-8
    check-template-location: true
#  sql:
#    init:
#      mode: always
#      schema-locations: classpath:db-init/schema.sql # 테이블 생성
#      data-locations: classpath:db-init/test-data.sql # 더미 데이터 세팅
server:
  shutdown: graceful # ??? ??? ??? graceful? ???, ??? ???? ? ???? ???? ???? ??? ???? ?? ??? ??? ???
  port: 8080 # 현재 Spring MVC 서버 포트 8080
  error:
    include-message: always
    include-exception: true
    include-stacktrace: always
api:
  externalUrl: http://localhost:8081 # ?? API ??(?? ??) -> ? ??? ?? ?? ???? ???? ????? ????. ?? url ??? ? ?? ??????...
logging:
  level:
    sodam.backend: debug
    org.springframework.r2dbc.core: debug
    org.springframework.r2dbc.connection.init: debug
    # ??? ??? ????? ??? ???? ? ?? ??? ???? ??? ??. ???, ?? ?? ??? ??? ?????? ???
    org.springframework.boot.autoconfigure.web.reactive.error.AbstractErrorWebExceptionHandler: off
    org.springframework.web.HttpLogging: off
  pattern:
    # console: "%d{HH:mm:ss.SSS}|%highlight(%-5level)|%X{txid:-}|%green(%t)|%logger|%blue(\\(%F:%L\\))|%msg%n" ?? ??. ????, logger ???? ????
    console: "%d{HH:mm:ss.SSS}|%highlight(%-5level)|%X{txid:-}|%green(%t)|%blue(\\(%F:%L\\))|%msg%n" # ?? - ???? - MDC?? ??? UUID
payment:
  self:
    domain: http://localhost:8080
  toss: # toss 결제 api
    domain: https://api.test.com
#    domain: https://api.tosspayments.com
    key:
      client: ${TOSS_CLIENT_ID}
      secret: ${TOSS_CLIENT_SECRET}
---
spring: # 내가 생성한 테이블을 h2에 어떻게 생성할까?
  config:
    activate:
      on-profile: test
  r2dbc:
    url: r2dbc:pool:h2:mem://localhost/payment
  sql:
    init:
      mode: always
      data-locations: "" # 테스트 환경에서는 더미 데이터 생성 x(h2 문제)