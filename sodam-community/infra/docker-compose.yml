services:
    mysql:
        image: mysql:8.0.41
        container_name: sodam-mysql
        restart: always
        ports:
            - '3306:3306'
        environment:
            MYSQL_ROOT_PASSWORD: "12341234"
            TZ: "Asia/Seoul"
        volumes:
            - ./db/mysql/data:/var/lib/mysql
            - ./db/mysql/init:/docker-entrypoint-initdb.d
        platform: linux/x86_64

    redis:
        image: redis:alpine
        container_name: sodam-redis
        restart: always
        command: redis-server
        hostname: redis
        ports:
            - "6379:6379"

    # zookeeper:
