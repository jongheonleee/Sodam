spring:
  output:
    ansi:
      enabled: always
  application:
    name: kafka-consumer
  main:
    web-application-type: none # 이거 있어야 8080 포트 충돌 발생안함
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest
  data:
    redis:
      host: localhost
      port: 6379
logging:
  level:
    sodam.payment_streamer: debug
  pattern:
    console: "%d{HH:mm:ss.SSS}|%highlight(%-5level)|%X{txid:-}|%green(%t)|%blue(\\(%F:%L\\))|%msg%n"
api:
  history:
    domain: http://localhost:8081